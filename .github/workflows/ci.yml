name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Verify Ruff formatting
        run: python -m ruff format --check .

      - name: Run unit tests
        run: python -m pytest -m unit -v

      - name: Run integration tests
        run: python -m pytest -m integration -v

      - name: Generate HTML and JSON reports
        if: always()
        run: >-
          python -m pytest
          --html=reports/report.html
          --self-contained-html
          --json-report
          --json-report-file=reports/report.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-service-test-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
