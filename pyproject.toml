[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "network-service-test-framework"
version = "0.1.0"
description = "Configurable pytest framework for deterministic TCP service validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-html>=4.1,<5",
    "pytest-json-report>=1.5,<2",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: fast tests that do not open network connections",
    "integration: tests that use deterministic local TCP services",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
